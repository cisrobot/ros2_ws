bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0  # 컨트롤러 실행 주기
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0  # 애커만 스티어링은 Y축 이동 없음
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3  # 장애물 회피 실패 시 재시도 허용 오차

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 경로 진행 체크 설정
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3  # 목표 이동 거리
      movement_time_allowance: 8.0  # 최대 허용 정체 시간

    # 목표 지점 도달 체크 설정
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2  # 목표 도달 허용 오차
      yaw_goal_tolerance: 0.2

    # 🚀 Regulated Pure Pursuit (RPP) 컨트롤러 설정
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # 속도 설정
      desired_linear_vel: 0.4  # 최대 속도 (0.3m/s)
      min_linear_velocity: 0.1  # 최소 속도 (정지 방지)
      max_angular_velocity: 0.4  # 최대 회전 속도
      min_angular_velocity: -0.4  # 최소 회전 속도
      
      # 회전 반경 설정 (애커만 스티어링 차량에 필수)
      lookahead_dist : 1.2
      use_velocity_scaled_lookahead_dist: false  # 속도 기반 lookahead 거리 조정
      min_lookahead_dist: 0.6  # 최소 전방 주시 거리
      max_lookahead_dist: 1.5  # 최대 전방 주시 거리
      lookahead_time: 2.5  # 속도 기반 lookahead 시간

      # 장애물 회피 설정
      regulate_linear_velocity: true  # 장애물 근처에서 속도 조절
      inflation_radius: 0.4  # 장애물과의 최소 거리
      use_collision_detection: true  # 충돌 감지 활성화
      approach_velocity_scaling_dist: 0.7  # 목표 지점 접근 시 감속 거리
      transform_tolerance: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0  # 초당 5회 costmap 업데이트 (값이 높을수록 반응 속도 ↑, CPU 부하 ↑)
      publish_frequency: 2.0  # 초당 2회 costmap을 퍼블리시 (디버깅 시 더 높일 수 있음)
      global_frame: odom  # Costmap이 odom 프레임을 기준으로 생성됨 (로컬 costmap이므로 odom이 적절함)
      robot_base_frame: base_link  # 로봇의 기준 프레임 (기본적으로 `base_link` 사용)
      use_sim_time: false  # 실제 환경에서는 false, 시뮬레이션 사용 시 true
      rolling_window: true  # ✅ 로봇이 이동할 때 costmap이 함께 이동 (로컬 costmap에 필수)
      width: 10  # Costmap 너비 (10m)
      height: 10  # Costmap 높이 (10m)
      resolution: 0.05  # Costmap 해상도 (0.05m/grid, 값이 작을수록 정밀도 ↑, CPU 부하 ↑)
      robot_radius: 0.3  # 로봇의 반경 (애커만 스티어링 차량에 맞게 설정)

      # ✅ Costmap에 사용할 플러그인 (Voxel Layer + Inflation Layer 조합)
      plugins: ["voxel_layer", "inflation_layer"]     

      # 🚀 장애물 감지를 위한 Voxel Layer 설정
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true  # Voxel Layer 활성화 (3D 장애물 감지 지원)
        publish_voxel_map: false  # ✅ 디버깅 시 true로 설정 가능 (Voxel Map을 Rviz에서 확인 가능)
        origin_z: 0.0  # Costmap의 시작 z축 위치
        z_resolution: 0.05  # Z축 방향 해상도 (더 작으면 정밀도 증가)
        z_voxels: 16  # Z축으로 몇 개의 계층을 사용할지 (높을수록 정밀하지만 CPU 부담 증가)
        max_obstacle_height: 0.6  # 장애물의 최대 높이 (0.6m 이상은 감지 X)
        min_obstacle_height: 0.2  # 장애물의 최소 높이 (0.2m 미만은 감지 X)
        mark_threshold: 0  # 장애물을 감지하는 임계값 (0이면 즉시 장애물로 인식)
        observation_sources: depth_camera  # 센서에서 얻은 데이터를 사용

        # 🚀 ZED XM 카메라의 포인트 클라우드를 사용하여 장애물 감지
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"  # 포인트 클라우드 데이터 토픽
          max_obstacle_height: 0.6  # 감지할 장애물의 최대 높이
          min_obstacle_height: 0.3  # 감지할 장애물의 최소 높이
          clearing: true  # 장애물이 사라지면 costmap에서 제거
          marking: true  # 장애물이 감지되면 costmap에 추가
          data_type: "PointCloud2"  # 데이터 형식 (ZED 카메라는 PointCloud2 사용)
          raytrace_max_range: 5.0  # 최대 레이 트레이싱 거리 (장애물 감지 범위)
          raytrace_min_range: 0.0  # 최소 레이 트레이싱 거리
          obstacle_max_range: 3.0  # 장애물 감지 최대 거리
          obstacle_min_range: 0.0  # 장애물 감지 최소 거리

      # 🚀 장애물 근처에서 회피 경로를 생성하는 Inflation Layer 설정
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0  # 장애물에 가까울수록 cost 값이 높아지는 속도
        inflation_radius: 0.2  # 장애물 주변에 영향을 미치는 반경 (0.6m)

      always_send_full_costmap: true  # Costmap 전체를 퍼블리시 (true로 설정해야 안정적)

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0  # 초당 5회 costmap 업데이트 (경로 탐색을 빠르게 반영)
      publish_frequency: 2.0  # 초당 2회 costmap을 퍼블리시
      global_frame: odom  # 글로벌 costmap도 odom 기준으로 설정 (Map 프레임이 없으므로 적절)
      robot_base_frame: base_link  # 로봇의 기준 프레임
      use_sim_time: false  # 실제 환경에서는 false
      robot_radius: 0.3  # 로봇 반경

      resolution: 0.1  # ✅ 글로벌 costmap 해상도 (0.1m/grid, 로컬보다 낮게 설정하여 CPU 부담 감소)
      width: 100  # Costmap 너비 (100m)
      height: 100  # Costmap 높이 (100m)
      origin_x: -10.0  # 글로벌 costmap의 시작 X 좌표
      origin_y: -10.0  # 글로벌 costmap의 시작 Y 좌표
      track_unknown_space: true  # ✅ 탐색되지 않은 공간을 costmap에 반영

      # ✅ Costmap에 사용할 플러그인 (Voxel Layer + Inflation Layer 조합)
      plugins: ["voxel_layer", "inflation_layer"]

      # 🚀 장애물 감지를 위한 Voxel Layer 설정
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true  # Voxel Layer 활성화
        publish_voxel_map: false  # ✅ 디버깅 시 true로 변경 가능
        origin_z: 0.0  # Costmap의 시작 z축 위치
        z_resolution: 0.1  # ✅ 글로벌 costmap에서는 해상도를 줄여서 CPU 부담 감소
        z_voxels: 10  # ✅ 글로벌 costmap이므로 voxel 수를 줄여서 연산량 감소
        max_obstacle_height: 0.6  # 장애물의 최대 높이
        min_obstacle_height: 0.3  # 장애물의 최소 높이
        mark_threshold: 0  # 장애물을 감지하는 임계값
        observation_sources: depth_camera

        # 🚀 글로벌 costmap에서 장애물 감지를 위한 포인트 클라우드 설정
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"
          max_obstacle_height: 0.6
          min_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0  # ✅ 글로벌 costmap에서 장애물 감지 범위를 늘려 넓은 지역 탐색 가능
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0

      # 🚀 장애물 회피를 위한 Inflation Layer 설정
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0  # 장애물 가까이 갈수록 cost가 높아지는 속도
        inflation_radius: 0.2  # 장애물 주변에 영향을 미치는 반경

      always_send_full_costmap: true  # Costmap 전체를 퍼블리시하여 일관성 유지

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
    
#planner_server:
  #ros__parameters:
   # expected_planner_frequency: 20.0  # 플래너가 실행되는 주기 (Hz), 20Hz → 0.05초마다 경로 다시 계산
    #use_sim_time: false  # 시뮬레이션 시간 사용 여부 (True면 /clock 토픽을 따라감)

    #planner_plugins: ["GridBased"]  # 사용할 글로벌 플래너 지정 ("GridBased"라는 이름을 사용)

    #GridBased:  # GridBased 플래너의 설정 (NavFn 사용)
     # plugin: "nav2_navfn_planner/NavfnPlanner"  # Nav2의 NavFn 플래너 사용 (기본 A* 기반 경로 계획)
     # tolerance: 0.5  # 목표 지점과 최대 0.5m 차이가 나도 도착한 것으로 인정
      #use_astar: false  # A* 알고리즘 활성화 (기본적으로 Dijkstra 사용)
      #allow_unknown: true  # 알려지지 않은 지도 영역도 탐색 가능 (True면 미탐색 지역도 지나갈 수 있음)

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: false

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false           
      downsampling_factor: 1              
      tolerance: 0.15                     
      allow_unknown: true                 
      max_iterations: 100000  # 기존 1000000 → 50000 (불필요한 재계산 줄임)
      max_on_approach_iterations: 1000    
      max_planning_time: 2.0  # 기존 5.0 → 1.5 (계획 시간 단축)
      motion_model_for_search: "DUBIN"    
      angle_quantization_bins: 72         
      analytic_expansion_ratio: 1.5 # 기존 3.5 → 1.2 (불필요한 경로 변경 방지)
      analytic_expansion_max_length: 3.0  
      analytic_expansion_max_cost: 200.0  
      analytic_expansion_max_cost_override: false  
      minimum_turning_radius: 1.0        
      reverse_penalty: 1000.0  # 기존 2.0 → 1000.0 (후진 절대 금지)
      change_penalty: 0.0                 
      non_straight_penalty: 1.2           
      cost_penalty: 3.0                   
      retrospective_penalty: 0.015
      lookup_table_size: 20.0             
      cache_obstacle_heuristic: true  # 기존 false → true (이전 경로 기억)
      debug_visualizations: false         
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True
      allow_primitive_interpolation: Falses
      smooth_path: True                   

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-5
      max_its: 500
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: -1.0
    rotational_acc_lim: 0.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
    ros__parameters:
      use_sim_time: false
      smoothing_frequency: 15.0  # 기존 50.0 → 30.0 (부드러운 속도 조정)
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [0.5, 0.0, 0.5]
      min_velocity: [0.0, 0.0, -1.0]
      max_accel: [0.1, 0.0, 0.2]  # 기존 1.0 → 0.8 (더 부드러운 가속)
      max_decel: [-0.3, 0.0, -0.3]  # 기존 -1.0 → -0.8 (더 부드러운 감속)
      odom_topic: "/odometry/filtered"
      odom_duration: 0.1
      deadband_velocity: [0.02, 0.0, 0.02]  # 기존 0.0 → 0.01 (미세한 진동 방지)