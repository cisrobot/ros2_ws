bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 100.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]  
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]  

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 3.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 1.0  
      lookahead_dist: 1.5  # 증가하여 불필요한 조향 최소화
      min_lookahead_dist: 1.0  
      max_lookahead_dist: 2.0  
      lookahead_time: 1.5  
      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.5  
      approach_velocity_scaling_dist: 1.0  

      use_collision_detection: true  
      max_allowed_time_to_collision_up_to_carrot: 1.0  

      use_regulated_linear_velocity_scaling: false  # Ackermann 차량에 적합하게 변경
      use_fixed_curvature_lookahead: false  
      curvature_lookahead_dist: 0.5  

      use_cost_regulated_linear_velocity_scaling: false  
      regulated_linear_scaling_min_radius: 0.8  
      regulated_linear_scaling_min_speed: 0.5  

      use_rotate_to_heading: false  
      allow_reversing: false  
      rotate_to_heading_min_angle: 1.57  # 기존 1.0 → 1.57 (90도 이상 차이 날 때만 회전)
      rotate_to_heading_angular_vel: 0.3  # 기존 0.5 → 0.3 (급격한 회전 방지)
      max_angular_accel: 0.3  # 기존 0.5 → 0.3 (부드러운 조향)

      max_robot_pose_search_dist: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 200.0 #5.0
      publish_frequency: 200.0 #2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.02
      robot_radius: 0.25
      plugins: ["voxel_layer", "inflation_layer"]     
      #plugins: ["obstacle_layer", "inflation_layer"]
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: true
      #   observation_sources: depth_camera
      #   depth_camera:
      #     topic: "/zed/zed_node/point_cloud/cloud_registered"
      #     #max_obstacle_height: 0.5
      #     max_obstacle_height: 0.8 
      #     #min_obstacle_height: 0.12 #
      #     min_obstacle_height: 0.2
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 3.0
      #     #raytrace_max_range: 2.0
      #     raytrace_min_range: 0.0
      #     #raytrace_min_range: 0.0
      #     obstacle_max_range: 3.0
      #     #obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      #     #obstacle_min_range: 0.0 
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.2
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.6
        min_obstacle_height: 0.2
        mark_threshold: 0
        observation_sources: depth_camera
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"
          max_obstacle_height: 0.5
          min_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 200.0
      publish_frequency: 200.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.02
      width: 100
      height: 100
      origin_x: -10.0  # X축 시작 좌표
      origin_y: -10.0  # Y축 시작 좌표
      track_unknown_space: true
      plugins: ["voxel_layer", "inflation_layer"]
      #plugins: ["obstacle_layer", "inflation_layer"]
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: true
      #   observation_sources: depth_camera
      #   depth_camera:
      #     topic: "/zed/zed_node/point_cloud/cloud_registered"
      #     max_obstacle_height: 1.2
      #     min_obstacle_height: 0.2
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.0
      #     obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false  # ✅ 디버깅이 필요하면 true로 변경
        origin_z: 0.0
        z_resolution: 0.05  # ✅ global costmap에서는 resolution을 높게 설정해야 CPU 부담 감소
        z_voxels: 10  # ✅ global_costmap이므로 voxel 수를 줄여서 연산량 감소
        max_obstacle_height: 0.8
        min_obstacle_height: 0.3
        mark_threshold: 0
        observation_sources: depth_camera
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"
          max_obstacle_height: 0.8
          min_obstacle_height: 0.3
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.3
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 100.0  # 플래너가 실행되는 주기 (Hz), 20Hz → 0.05초마다 경로 다시 계산
    use_sim_time: True  # 시뮬레이션 시간 사용 여부 (True면 /clock 토픽을 따라감)

    planner_plugins: ["GridBased"]  # 사용할 글로벌 플래너 지정 ("GridBased"라는 이름을 사용)

    GridBased:  # GridBased 플래너의 설정 (NavFn 사용)
      plugin: "nav2_navfn_planner/NavfnPlanner"  # Nav2의 NavFn 플래너 사용 (기본 A* 기반 경로 계획)
      tolerance: 0.5  # 목표 지점과 최대 0.5m 차이가 나도 도착한 것으로 인정
      use_astar: false  # A* 알고리즘 비활성화 (기본적으로 Dijkstra 사용)
      allow_unknown: true  # 알려지지 않은 지도 영역도 탐색 가능 (True면 미탐색 지역도 지나갈 수 있음)



smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
    ros__parameters:
      use_sim_time: false
      smoothing_frequency: 20.0  # 기존 50.0 → 30.0 (부드러운 속도 조정)
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [1.0, 0.0, 0.4]
      min_velocity: [0.0, 0.0, 0.0]
      max_accel: [0.6, 0.0, 0.2]  # 기존 1.0 → 0.8 (더 부드러운 가속)
      max_decel: [-0.6, 0.0, -0.2]  # 기존 -1.0 → -0.8 (더 부드러운 감속)
      odom_topic: "/odometry/filtered"
      odom_duration: 0.1
      deadband_velocity: [0.01, 0.0, 0.0]  # 기존 0.0 → 0.01 (미세한 진동 방지)
