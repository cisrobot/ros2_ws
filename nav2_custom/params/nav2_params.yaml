bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: False  # 시뮬레이션 시간 사용 여부 (True: /clock 토픽의 시간을 사용)
    controller_frequency: 20.0  # 컨트롤러 실행 주기 (Hz) → 0.05초마다 속도 명령 생성
    min_x_velocity_threshold: 0.001  # x축 속도가 0.001m/s 이하이면 0으로 간주 (진동 방지)
    min_y_velocity_threshold: 0.0  # y축 속도 최소값 (Holonomic 로봇 전용, 일반 Ackermann 로봇에는 무시됨)
    min_theta_velocity_threshold: 0.001  # 회전 속도가 0.001 rad/s 이하이면 0으로 간주

    # 로봇이 목표까지 제대로 이동하는지 확인하는 플러그인
    progress_checker_plugins: ["progress_checker"]  
    goal_checker_plugins: ["goal_checker"]

    # 사용할 컨트롤러 플러그인 지정
    controller_plugins: ["FollowPath"]  

    # 이동 진행 상태 확인 (로봇이 멈춰있거나 막혔을 때 감지)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # 5초 동안 최소 0.5m 이상 이동해야 정상적인 진행으로 판단
      movement_time_allowance: 5.0  # 5초 이상 멈춰 있으면 경로를 다시 계획하도록 설정

    # 목표 도달 여부 확인 (로봇이 목표 위치에 도착했는지 판별)
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25  # 목표 지점과 0.25m 이내면 도착한 것으로 판단
      yaw_goal_tolerance: 0.25  # 목표 방향과 0.25 rad (약 14도) 이내면 도착한 것으로 판단
      stateful: True  # 목표 지점에 도착한 상태를 유지해야 목표 도달로 인정 (False면 한 번 지나가도 도착 인정됨)

    # Pure Pursuit 기반 컨트롤러 설정
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # 로봇이 따라가는 기본 선속도 설정
      desired_linear_vel: 0.5  # 기본 선속도 (m/s)

      # 로봇이 따라가는 lookahead 거리 설정
      lookahead_dist: 0.6  # 기본 lookahead 거리 (m)
      min_lookahead_dist: 0.3  # 최소 lookahead 거리 (m)
      max_lookahead_dist: 0.9  # 최대 lookahead 거리 (m)
      lookahead_time: 1.5  # 현재 속도를 기반으로 lookahead 거리 동적으로 조정하는 시간 (s)
      use_velocity_scaled_lookahead_dist: false  # 속도에 따라 lookahead 거리 조정 여부 (false면 고정값 사용)

      # 목표 지점에 가까워질 때 속도 조절
      min_approach_linear_velocity: 0.5  # 목표 지점 접근 시 최소 선속도 (m/s)
      approach_velocity_scaling_dist: 0.6  # 목표 지점 0.6m 전부터 감속 시작

      # 장애물 충돌 감지 및 속도 조절
      use_collision_detection: true  # 충돌 감지 기능 활성화
      max_allowed_time_to_collision_up_to_carrot: 1.0  # lookahead 지점까지 충돌 예상 시간이 1초 이하이면 감속

      # 경로를 따라갈 때 속도 조절 방식
      use_regulated_linear_velocity_scaling: true  # 경로의 곡률에 따라 속도를 조정할지 여부
      use_fixed_curvature_lookahead: false  # 고정된 곡률 lookahead 사용 여부 (false면 동적 계산)
      curvature_lookahead_dist: 0.25  # 곡률 lookahead 거리 (m)

      # 비용맵 기반 속도 조정
      use_cost_regulated_linear_velocity_scaling: false  # 비용맵(costmap) 기반 속도 조절 여부
      regulated_linear_scaling_min_radius: 0.9  # 곡률 반경이 0.9m 이하일 때 속도 감소
      regulated_linear_scaling_min_speed: 0.5  # 감속 시 최소 선속도 (m/s)

      # 회전 관련 설정
      use_rotate_to_heading: true  # 목표 방향을 향해 먼저 회전한 후 이동할지 여부
      allow_reversing: false  # 후진 가능 여부 (false면 후진 불가능)
      rotate_to_heading_min_angle: 0.785  # 목표 방향과의 각도 차이가 0.785 rad(약 45도) 이상이면 먼저 회전 후 이동
      rotate_to_heading_angular_vel: 1.0  # 회전 속도 (rad/s)
      max_angular_accel: 3.2  # 최대 각가속도 (rad/s²)

      # 로봇이 경로에서 벗어났을 때 최대 탐색 거리
      max_robot_pose_search_dist: 10.0  # 경로 상에서 최대 10m까지 로봇의 위치를 찾음

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.25
      # plugins: ["voxel_layer", "inflation_layer"]     
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_camera
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"
          max_obstacle_height: 0.5
          min_obstacle_height: 0.12
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0 
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: true
      #   publish_voxel_map: false
      #   origin_z: 0.3
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 0.5
      #   min_obstacle_height: 0.12
      #   mark_threshold: 0
      #   observation_sources: depth_camera
      #   depth_camera:
      #     topic: "/zed/zed_node/point_cloud/cloud_registered"
      #     max_obstacle_height: 0.5
      #     min_obstacle_height: 0.12
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 2.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 1.5
      #     obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.05
      width: 100
      height: 100
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_camera
        depth_camera:
          topic: "/zed/zed_node/point_cloud/cloud_registered"
          max_obstacle_height: 0.5
          min_obstacle_height: 0.12
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # 플래너가 실행되는 주기 (Hz), 20Hz → 0.05초마다 경로 다시 계산
    use_sim_time: True  # 시뮬레이션 시간 사용 여부 (True면 /clock 토픽을 따라감)

    planner_plugins: ["GridBased"]  # 사용할 글로벌 플래너 지정 ("GridBased"라는 이름을 사용)

    GridBased:  # GridBased 플래너의 설정 (NavFn 사용)
      plugin: "nav2_navfn_planner/NavfnPlanner"  # Nav2의 NavFn 플래너 사용 (기본 A* 기반 경로 계획)
      tolerance: 0.5  # 목표 지점과 최대 0.5m 차이가 나도 도착한 것으로 인정
      use_astar: false  # A* 알고리즘 비활성화 (기본적으로 Dijkstra 사용)
      allow_unknown: true  # 알려지지 않은 지도 영역도 탐색 가능 (True면 미탐색 지역도 지나갈 수 있음)



smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0